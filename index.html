<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedSpa</title>

    <link rel="stylesheet" href="complexAPI2Medspa.css">
</head>

<body>
<div class="container">
 <h1>MedSpa</h1>
        <div class="section">
         <h2>Holiday Promotion</h2>
            <p>Enter a holiday to see if we have a promotion. Refresh page to enter a new holiday.</p>
            <input
                type="text"
                id="holidayInput"
                placeholder="Example: Christmas Day">

            <button id="holidayButton">
                Check Promotion
            </button>

            <div id="promotion">
                <div id="holidayName"></div>
                <div id="holidayDate"></div>
                <div id="offer"></div>
            </div>
            <hr>
            <h2>Claim Your Promotion</h2>
            <p>Enter your email to claim your offer!</p>

            <input
                type="email"
                id="email"
                placeholder="email@domain.com">

            <button id="verifyButton">
                Verify Email
            </button>

            <div id="result"></div>
            </div>
            </div>

    <script src="complexAPI2Medspa.js"></script>
</body>
</html>

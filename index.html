<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Beauty Product Ingredient Search</title>
        <link rel="stylesheet" href="./css/styles.css">
    </head>

    <body>
        <header>
            <h1>Beauty Product Ingredient Search</h1>
        </header>

        <main>
            <section>
                <p>Enter a beauty product name. We'll search Open Beauty Facts and return product information. Then
                    we'll search the EMBL's European Bioinformatics Institute and return ingredient information.</p>
            </section>

            <section>
                <div>
                    <label for="productName">Product Name:</label>
                    <input type="text" id="productName">
                    <button>Search</button>
                </div>
            </section>

            <section>
                <h2>Product Information</h2>
                <section id="informationProduct"></section>
            </section>

            <section>
                <h2>Ingredient Information</h2>
                <section id="informationIngredients"></section>
            </section>
        </main>

        <footer>
            <small>Made by: Niles</small>
        </footer>

        <script type="text/javascript" src="./js/main.js"></script>
    </body>

</html>
